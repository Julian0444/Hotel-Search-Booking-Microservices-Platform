name: ci

on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [users-api, hotels-api, search-api, platform-contracts]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # stable y no go-version-file: instalar la versión exacta del go.mod
          # deja un stdlib sin parches (govulncheck rojo) y fuerza un switch de
          # toolchain que rompe covdata en el runner
          go-version: stable
          check-latest: true
          # go.* y no go.sum: platform-contracts no tiene go.sum (cero deps) y
          # setup-go falla si el path de cache no matchea ningún archivo (RV13)
          cache-dependency-path: ${{ matrix.module }}/go.*
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8 # CLI v2, lee el .golangci.yml raíz
        with:
          working-directory: ${{ matrix.module }}
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...
      - name: govulncheck
        run: |
          GOWORK=off go install golang.org/x/vuln/cmd/govulncheck@latest
          GOWORK=off govulncheck ./...

  # Tests de integración (testcontainers): solo en PRs para no encarecer cada push
  integration:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hotels-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: hotels-api/go.sum
      - run: go test -tags=integration ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high

  # Supply-chain de imágenes (plan 09, CN4): build multi-stage + Trivy como gate
  # en cada push/PR; push multi-arch a GHCR con tags inmutables solo en main
  # (y en tags v* para el semver). needs: go — nunca publicar imágenes de un
  # commit con tests rotos.
  docker:
    needs: go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push a ghcr.io con el GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          # hotels/search buildean con contexto RAÍZ: el replace de go.mod
          # necesita platform-contracts/ dentro del contexto
          - service: users-api
            context: ./users-api
            dockerfile: ./users-api/Dockerfile
          - service: hotels-api
            context: .
            dockerfile: ./hotels-api/Dockerfile
          - service: search-api
            context: .
            dockerfile: ./search-api/Dockerfile
    steps:
      - uses: actions/checkout@v4
      # QEMU solo emula el stage final alpine en arm64; el toolchain de Go
      # cross-compila nativo (--platform=$BUILDPLATFORM en los Dockerfiles)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build para escaneo (amd64, sin push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: local/${{ matrix.service }}:scan
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy (gate de HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.service }}:scan
          exit-code: "1"
          severity: HIGH,CRITICAL
          # Sin fix upstream no hay acción posible: el gate queda accionable
          # (sobre multi-stage el scan ve binario + alpine final, no el toolchain)
          ignore-unfixed: true
      - name: Login a GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags inmutables (sha- siempre; semver en tags v*)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/julian0444/${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
      - name: Push multi-arch a GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
