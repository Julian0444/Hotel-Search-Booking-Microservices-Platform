###############################################################################
#                    NGINX LOAD BALANCER - API GATEWAY                        #
#           Hotel Search & Booking Microservices Platform                     #
###############################################################################

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # =========================================================================
    # LOGGING CONFIGURATION
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'uct="$upstream_connect_time" uht="$upstream_header_time" '
                    'urt="$upstream_response_time" upstream="$upstream_addr"';

    # X-Request-ID end-to-end (O1): respetar el ID que ya trae el cliente y
    # generar uno solo si falta. $request_id a secas es SIEMPRE el random de
    # nginx y pisaría el entrante.
    map $http_x_request_id $req_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    log_format json_combined escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$req_id"'
    '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # PERFORMANCE OPTIMIZATIONS
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/xml+rss application/x-javascript;

    # =========================================================================
    # UPSTREAM DEFINITIONS - LOAD BALANCING
    # =========================================================================

    # Users API - 3 instances with load balancing
    upstream users_api {
        least_conn;  # Algoritmo: menor cantidad de conexiones activas

        server users-api-1:8082 weight=1 max_fails=3 fail_timeout=30s;
        server users-api-2:8082 weight=1 max_fails=3 fail_timeout=30s;
        server users-api-3:8082 weight=1 max_fails=3 fail_timeout=30s;

        keepalive 32;  # Conexiones persistentes
    }

    # Hotels API - Single instance (puede escalarse igual que users)
    upstream hotels_api {
        server hotels-api-container:8081 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Search API - Single instance (puede escalarse igual que users)
    upstream search_api {
        server search-api-container:8082 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # =========================================================================
    # RATE LIMITING
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # I7: "me limitaste" es 429, no 503 (que se confunde con "upstream caído").
    # El error_page 429 de abajo lo convierte al envelope JSON estándar.
    limit_req_status 429;
    limit_conn_status 429;

    # =========================================================================
    # PROXY CACHE (I3): zona real para /api/v1/search — antes había un
    # proxy_cache_valid sin proxy_cache_path _ni_ proxy_cache: un no-op.
    # =========================================================================
    proxy_cache_path /var/cache/nginx/search levels=1:2 keys_zone=search_cache:10m
                     max_size=100m inactive=10m use_temp_path=off;

    # =========================================================================
    # CORS Configuration Map
    # =========================================================================
    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "http://localhost:5173" $http_origin;
        "http://localhost:5174" $http_origin;
        "http://localhost:5175" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
        "http://127.0.0.1:5173" $http_origin;
        "http://127.0.0.1:5174" $http_origin;
        "http://127.0.0.1:5175" $http_origin;
    }

    # =========================================================================
    # HTTP → HTTPS REDIRECT (Port 80, SD4)
    # =========================================================================
    server {
        listen 80;
        server_name localhost;

        # Todo el tráfico va por TLS. El healthcheck del contenedor no pasa por
        # acá: usa el server de monitoreo :8090 (HTTP-only, ver abajo).
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # MAIN SERVER - API GATEWAY (Port 443, TLS)
    # =========================================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # SD4: cert local self-signed — generación documentada en
        # nginx/certs/README.md (los .pem no se commitean; el compose monta
        # ./nginx/certs). En producción: cert real (Let's Encrypt).
        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers (SD5): via snippet porque la herencia de add_header
        # los descartaría en toda location con add_header propios (las de CORS).
        # El snippet se re-incluye en cada una de esas locations y en sus
        # bloques OPTIONS. Incluye HSTS (solo tiene sentido en este server).
        include /etc/nginx/snippets/security-headers.conf;

        # Connection limits
        limit_conn conn_limit 20;

        # Common proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $req_id;

        # Default timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;

        # ---------------------------------------------------------------------
        # ERROR ENVELOPE (A1): los errores que genera el PROPIO nginx salen con
        # el mismo shape JSON que los servicios, no con la pagina HTML default.
        # Los 5xx que emite un upstream vivo pasan intactos (ya traen el
        # envelope). El 429 va aparte: aca lo genera el rate/conn limit (I7,
        # limit_req_status/limit_conn_status arriba) y responde su propio
        # envelope "rate_limited" con status 429.
        # ---------------------------------------------------------------------
        error_page 500 502 504 = @api_error;
        location @api_error {
            default_type application/json;
            return 502 '{"error":{"code":"upstream_unavailable","message":"service temporarily unavailable","trace_id":"$req_id"}}';
        }

        error_page 429 = @api_rate_limited;
        location @api_rate_limited {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"too many requests, slow down","trace_id":"$req_id"}}';
        }

        # ---------------------------------------------------------------------
        # HEALTH CHECK ENDPOINT
        # ---------------------------------------------------------------------
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"api-gateway","timestamp":"$time_iso8601"}';
            include /etc/nginx/snippets/security-headers.conf;
            add_header Content-Type application/json;
        }

        # ---------------------------------------------------------------------
        # USER RESERVATIONS (HOTELS API) - Must be BEFORE general /users routes
        # ---------------------------------------------------------------------
        # Reservations by user ID -> Hotels API
        location ~ ^/api/v1/users/([^/]+)/reservations$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/users/$1/reservations$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        # Reservations by user ID and hotel ID -> Hotels API
        location ~ ^/api/v1/users/([^/]+)/hotels/([^/]+)/reservations$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/users/$1/hotels/$2/reservations$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        # ---------------------------------------------------------------------
        # USERS API ENDPOINTS (Load Balanced)
        # ---------------------------------------------------------------------
        location /api/v1/users {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://users_api/api/v1/users;

            # CORS headers
            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location ~ ^/api/v1/users/(.+)$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://users_api/api/v1/users/$1$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        location /api/v1/login {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            # Rate limiting más estricto para login
            limit_req zone=login_limit burst=3 nodelay;

            proxy_pass http://users_api/api/v1/login;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Upstream-Server $upstream_addr always;
        }

        # ---------------------------------------------------------------------
        # HOTELS API ENDPOINTS
        # ---------------------------------------------------------------------
        location /api/v1/hotels {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/hotels;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location ~ ^/api/v1/hotels/(.+)$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/hotels/$1$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location /api/v1/reservations {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/reservations;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location ~ ^/api/v1/reservations/(.+)$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://hotels_api/api/v1/reservations/$1$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # Admin endpoints
        location /api/v1/admin {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://hotels_api/api/v1/admin;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        location ~ ^/api/v1/admin/(.+)$ {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://hotels_api/api/v1/admin/$1$is_args$args;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # ---------------------------------------------------------------------
        # SEARCH API ENDPOINTS
        # ---------------------------------------------------------------------
        location /api/v1/search {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=30 nodelay;

            # Cache real de búsquedas (I3): 5 min para 200. La key incluye la
            # query string ($request_uri), así queries distintas no comparten
            # entrada. Resultados hasta 5 min viejos: coherente con el modelo
            # CQRS-lite — Solr ya es eventualmente consistente por diseño.
            proxy_cache search_cache;
            proxy_cache_key "$request_uri";
            proxy_cache_valid 200 5m;
            proxy_cache_use_stale error timeout updating;

            proxy_pass http://search_api/api/v1/search;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Reindex on-demand del índice de Solr (solo admins; search-api valida el JWT)
        location /api/v1/reindex {
            # CORS preflight
            if ($request_method = 'OPTIONS') {
                include /etc/nginx/snippets/security-headers.conf;
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization, Idempotency-Key' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age' 86400;
                add_header 'Content-Length' 0;
                return 204;
            }

            limit_req zone=api_limit burst=10 nodelay;

            proxy_pass http://search_api/api/v1/reindex;

            include /etc/nginx/snippets/security-headers.conf;
            add_header 'Access-Control-Allow-Origin' $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
        }

        # ---------------------------------------------------------------------
        # FALLBACK - 404
        # ---------------------------------------------------------------------
        location / {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"the requested endpoint does not exist; the API is versioned under /api/v1","trace_id":"$req_id"}}';
        }
    }

    # =========================================================================
    # MONITORING SERVER (Port 8090) — HTTP-only interno. El compose lo publica
    # SOLO en loopback (127.0.0.1:8090, RV26): stub_status no queda expuesto
    # fuera de la máquina local.
    # =========================================================================
    server {
        listen 8090;
        server_name localhost;

        # Healthcheck del contenedor (el :80 ahora es un 301 a https y el wget
        # de busybox no puede validar el cert self-signed).
        location /nginx-health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Nginx status page
        location /nginx_status {
            stub_status on;
            access_log off;
            allow all;
        }

        # JSON status endpoint
        location /status {
            access_log off;
            default_type application/json;
            return 200 '{
                "status": "healthy",
                "timestamp": "$time_iso8601",
                "load_balancer": {
                    "algorithm": "least_conn",
                    "upstreams": {
                        "users_api": {
                            "instances": 3,
                            "servers": ["users-api-1:8082", "users-api-2:8082", "users-api-3:8082"]
                        },
                        "hotels_api": {
                            "instances": 1,
                            "servers": ["hotels-api-container:8081"]
                        },
                        "search_api": {
                            "instances": 1,
                            "servers": ["search-api-container:8082"]
                        }
                    }
                },
                "rate_limiting": {
                    "api_limit": "10 req/sec",
                    "login_limit": "5 req/min"
                }
            }';
        }

        # Health check for all services
        location /health/all {
            access_log off;
            default_type application/json;

            # This is a simplified health check
            # In production, you would use nginx-upstream-check-module
            return 200 '{"api_gateway":"healthy","note":"For detailed health, check each service endpoint"}';
        }
    }
}
