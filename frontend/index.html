<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StayLux — search indexed stays, reserve with protected availability, and manage your bookings." />
    <meta name="theme-color" content="#1a365d" />

    <!-- Fonts: carga NO bloqueante (fase 9/FE2) — el CSS de Google Fonts como
         stylesheet plano bloqueaba el first paint ~900ms en mobile (Lighthouse).
         preload + swap a stylesheet en onload; los font stacks del theme llevan
         Georgia/system fallbacks y display=swap, así que el texto pinta al toque
         y la app queda legible si Google Fonts no responde -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    </noscript>

    <title>StayLux</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
