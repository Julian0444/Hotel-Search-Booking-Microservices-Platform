# Optional host reverse proxy. Replace domain/certificate paths; do not use the
# local self-signed certificate for a public site. This file is NOT auto-loaded.
server {
    listen 80;
    server_name hotel.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name hotel.example.com;
    ssl_certificate /etc/letsencrypt/live/hotel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotel.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        # Frontend nginx serves the SPA and forwards /api/v1 to the API gateway.
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
