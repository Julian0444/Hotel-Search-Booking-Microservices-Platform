# Una sola instancia: eventos y reconciliación comparten exclusión local.
# Recreate impide dos escritores durante un rollout. No escalar este servicio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: hotel-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-api
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: search-api
    spec:
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 20
      containers:
        - name: search-api
          image: ghcr.io/julian0444/search-api:sha-1408d76 # tag inmutable (CN4); build con contexto RAÍZ (replace de go.mod)
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          env:
            - name: PORT
              value: "8082"
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "3"]
          readinessProbe:
            httpGet:
              path: /readyz # Solr requerido; broker secundario visible
              port: 8082
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8082
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: hotel-platform
spec:
  selector:
    app: search-api
  ports:
    - port: 8082
