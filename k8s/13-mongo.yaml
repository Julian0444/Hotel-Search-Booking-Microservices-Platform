    } else {
      print('seed: la colección hotels ya tiene datos, no se siembra');
    }

    // Índices de reservas también acá: refuerza DB2 en un arranque limpio, antes
    // de que hotels-api corra EnsureIndexes (misma spec, idempotente).
    db.reservations.createIndex({ hotel_id: 1, check_in: 1, check_out: 1 });
    db.reservations.createIndex({ user_id: 1 });
    // Índice ÚNICO del inventario por hotel-noche: sostiene el claim atómico del
    // no-overbooking (D1, plan 04). Misma spec que EnsureIndexes.
    db.reservation_inventory.createIndex({ hotel_id: 1, date: 1 }, { unique: true });
    print('seed: índices de reservations e inventario asegurados');
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: hotel-platform
spec:
  clusterIP: None # headless: DNS estable para el StatefulSet
  selector:
    app: mongo
  ports:
    - port: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: hotel-platform
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:6
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MONGO_PASSWORD
            - name: MONGO_INITDB_DATABASE
              value: hotels-api
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          startupProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: init
          configMap:
            name: mongo-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
