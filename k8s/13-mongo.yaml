# HISTÓRICO: standalone incompatible con transacciones actuales. Ver README.md.
# MongoDB como StatefulSet dev con PVC chico (CN1, paso 4).
# Sigue standalone a propósito: el no-overbooking del plan 04 usa contadores
# atómicos por hotel-noche, no transacciones multi-documento — no hace falta
# replica set. En prod: servicio managed (Atlas/DocumentDB). Ver k8s/README.md.
#
# El seed es COPIA de hotels-api/seed/mongo-init.js (fuente canónica): si cambia,
# regenerar este ConfigMap. Igual que en compose, initdb solo corre con un
# volumen NUEVO — para re-sembrar, borrar el PVC (kubectl delete pvc data-mongo-0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongo-init
  namespace: hotel-platform
data:
  mongo-init.js: |
    // Seed de hoteles demo (P7). Corre UNA sola vez, cuando el volumen de Mongo es
    // nuevo (docker-entrypoint-initdb.d). Para re-sembrar: docker compose down -v.
    //
    // Los nombres de campo son los bson tags reales de hotels_dao.go — incluido el
    // available_rooms ya con el nombre corregido (rename C11, plan 11).
    //
    // Nota (plan 06): estos hoteles NO aparecen en /search hasta que exista el
    // backfill de Solr — el índice se alimenta por eventos de RabbitMQ que el seed
    // no emite. Verificarlos vía GET /hotels/:id o mongosh.

    db = db.getSiblingDB('hotels-api');

