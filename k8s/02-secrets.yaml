# Secretos compartidos (CN1). stringData con valores DEMO — mismo espíritu que
# .env.example: cambiarlos antes de cualquier uso no-local.
# En prod esto NO se commitea: referirlo a un secrets manager (External Secrets
# Operator / sealed-secrets / SOPS) y dejar acá solo el nombre esperado.
#
# MYSQL_PASSWORD duplica MYSQL_ROOT_PASSWORD a propósito: users-api lee
# MYSQL_PASSWORD y el contenedor mysql lee MYSQL_ROOT_PASSWORD (paridad compose).
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: hotel-platform
type: Opaque
stringData:
  JWT_SECRET: change-me-to-a-long-random-string-of-32-chars-min
  MYSQL_ROOT_PASSWORD: change-me-mysql
  MYSQL_PASSWORD: change-me-mysql
  MONGO_PASSWORD: change-me-mongo
  RABBIT_PASSWORD: change-me-rabbit
  ADMIN_USERNAME: admin
  ADMIN_PASSWORD: change-me-admin-123
