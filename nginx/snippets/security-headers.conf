# Security headers del gateway (SD5).
#
# Gotcha de herencia de nginx: si una location (o un `if` dentro de una
# location) declara CUALQUIER add_header propio — las de CORS lo hacen —
# descarta TODOS los add_header heredados del nivel server. Por eso este
# snippet se incluye en el server 443 Y dentro de cada location/if que tenga
# add_header propios, para que los headers lleguen a TODAS las respuestas
# (incluidas las preflight OPTIONS 204).
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# HSTS (SD4). Solo tiene sentido en el server 443 — este snippet no se incluye
# en el server 80 (redirect) ni en el 8090 (monitoreo interno). Nota local:
# los browsers ignoran HSTS recibido sobre una conexión con errores de cert
# (RFC 6797), así que con el self-signed es inerte; queda demostrada la config
# de producción. Ver nginx/certs/README.md para el caveat con mkcert.
add_header Strict-Transport-Security "max-age=31536000" always;
